 BERN_SE_LOGIC_ERROR_TITLE:0 "§MЛОГИЧЕСКАЯ ОШИБКА: РЕСПУБЛИКА КОШАЧЬЕГО ЯЩИКА§!"
 BERN_SE_LOGIC_ERROR_QUOTE:0 "«Истина не существует вовне. Она запечатана внутри. И пока ящик не открыт — всё возможно, и ничто не истинно».\n§Y— Ведьма Чудес§!"
