 BERN_schelling_nuclear_category:0 "Терминал USSTRATCOM: Инверсия Порога Шеллинга"
 BERN_schelling_nuclear_category_desc:0 "§Y[МОДЕЛЬ RAND CORPORATION (1959) vs КАЗУС КЛЕР]§!\nВ классической теории Томаса Шеллинга («Угроза, оставляющая место случаю») рациональный лидер создаёт умеренный 5%-ный риск срыва в войну, чтобы удержать оппонента. Но для Ведьмы Осколков физическая гибель этого мира означает лишь повод перешагнуть на следующую доску."

 BERN_targeted_schelling_ultimatum:0 "Ядерный ультиматум: [From.GetNameDef]"
 BERN_targeted_schelling_ultimatum_desc:0 "Отправить [From.GetNameDef] ультиматум по Казусу Клер. При риске выше 80% цель с вероятностью 90% пойдет на односторонние уступки США, либо с вероятностью 10% начнется ядерная война."

 BERN_SCHELLING_GUI_TITLE:0 "§RИНВЕРСИЯ ЯДЕРНОГО ПОРОГА ТОМАСА ШЕЛЛИНГА§!"
 BERN_RAND_1959_LABEL:0 "§C> Рациональный блеф по Шеллингу (RAND, 1959):§! Риск §C5,0%§! (1 из 20) | Мир §G95,0%§!"
 BERN_RAND_1959_BAR_TT:0 "Классическая модель сдерживания: 19 шансов из 20 на управляемую деэскалацию при условии, что оба игрока боятся взаимного уничтожения."

 BERN_PUZZLE_BAR_LABEL:0 "§M> Ядерный пазл Бернкастель (Казус Клер):§! Риск §R[?BERN_schelling_brinkmanship_risk]%§! | Чудо: §Y0,0000388%§!"
 BERN_PUZZLE_BAR_TT:0 "Текущий уровень автономной принудительной эскалации: §R[?BERN_schelling_brinkmanship_risk]%§!.\nНа правом краю шкалы (100%) оставлена микроскопическая золотая засечка — ровно 1 шанс из 2 578 917 избежать автоматического пуска."
 BERN_GOLDEN_SLIVER_TT:0 "§YЗолотая засечка на правом краю (100%):§!\nP(выживание) = 1 / 2 578 917 = 0,0000388%.\nМикроскопический зазор выживания, превращающий ядерный ультиматум в асимметричную психологическую пытку."

 BERN_PROBABILITY_MATH_READOUT:0 "Исходов тотальной войны: §R2 578 916§! | Зазор на «чудо»: §Y1 из 2 578 917§!\nТекущий вычет скуки Гейммастера от ядерного балансирования: §G-25.0%§!"

 BERN_DUEL_MIRACLES_TT:0 "§MВедьма Чудес (Фредерика Бернкастель)§!\nКонцептуально обнуляет любые чудеса, пока противник сам не вытащит счастливый билет из 2,5 миллионов."
 BERN_DUEL_CERTAINTY_TT:0 "§YВедьма Определённости (Лямбдадельта)§!\nМетафорический образ противостоящих ядерных сверхдержав: столкновение двух ведьм порождает и выжигает целые вселенные."
 BERN_DUEL_CENTER_TELEMETRY:0 "§YСТАТУС КОНТУРА СПРН (SIOP-62):§!\n• Автономный риск срыва: §R[?BERN_schelling_brinkmanship_risk]%§!\n• Скука Бернкастель: §M[?BERN_existential_boredom|1]%§!\n• Логическая Ошибка: §G[?BERN_logic_error_progress|1]%§!"

 BERN_BTN_COUPLE_NORAD:0 "Связать NORAD"
 BERN_BTN_COUPLE_NORAD_TT:0 "Потратить §Y25 Командного ресурса§!: Замкнуть спутники СПРН на генератор случайных чисел.\n• Автономный риск войны: §R+15%§!\n• Экзистенциальная скука: §G-12%§!\n• Логическая Ошибка: §M+6%§!"

 BERN_BTN_BYPASS_PAL:0 "Снять замки PAL"
 BERN_BTN_BYPASS_PAL_TT:0 "Потратить §Y40 Полит. власти§!: Отключить предохранители Permissive Action Links на шахтах МБР.\n• Автономный риск войны: §R+25%§!\n• Экзистенциальная скука: §G-20%§!\n• Антимагический токсин: §G-10%§!"

 BERN_BTN_VENT_TENSION:0 "Сбросить риск"
 BERN_BTN_VENT_TENSION_TT:0 "Временно развести контуры боевого дежурства.\n• Автономный риск войны: §G-20%§!\n• Экзистенциальная скука: §R+18%§! §g(Предсказуемая безопасность раздражает Бернкастель)§!"

 BERN_BTN_CLAIR_GAMBIT:0 "КАЗУС КЛЕР: ШАНС 1 ИЗ 2 578 917"
 BERN_BTN_CLAIR_GAMBIT_TT:0 "Зафиксировать риск на отметке §R99,99996%§! и заставить ядерные сверхдержавы тянуть жребий:\n• §G90% шанс:§! Противники моргают первыми (+200 ПП, +10% Стабильности, -40% Скуки).\n• §R10% шанс:§! Срыв протокола СПРН и запуск предвоенного термоядерного кризиса."
