 BERN_main_core_index_tt:0 "§RMAIN CORE:§! Тотальный реестр ускоряет подчинение неинтегрированных штатов."
 BERN_fvra_loophole_tt:0 "§Y5 U.S.C. § 3345:§! Доступ к переназначению ИО и обходу 210-дневного потолка."
 BERN_senate_bypassed_tt:0 "Сенат отстранён от утверждения министров и судей."
 BERN_amendment_25_paralyzed_tt:0 "§R25-я Поправка мертва:§! Замена министров на «мебель» исключает импичмент изнутри."
 BERN_schedule_policy_furniture_tt:0 "§YSchedule Policy/Career:§! Десятки тысяч чиновников лишены защиты и работают на заводы Доски."
 BERN_clair_appointed_tt:0 "§GКлэр Во Бернардус назначена рупором Госдепартамента и Белого дома.§!"
 BERN_void_ab_initio_tt:0 "§R5 U.S.C. § 3348:§! Стирание прошлых актов в Лотке Фигур обнуляет 210-дневный таймер FVRA."
 BERN_dlanor_inauguration_tt:0 "§RДланор А. Нокс занимает пост Генерального прокурора США!§!"
 BERN_ashcroft_mandate_tt:0 "Меморандум Эшкрофта 2.0 открывает путь к жёстким трибуналам Декалога."
 BERN_red_truth_monopoly_tt:0 "§RNavy v. Egan:§! Любой критик администрации мгновенно теряет допуск к секретности."
 BERN_purple_paradox_tt:0 "§M18 U.S.C. § 1001:§! Начинается 3-этапный допрос Сената по Пурпурной Истине."
 BERN_willard_appointed_tt:0 "§YУиллард Х. Райт вступает на доску как ревизор... и потенциальный бунтарь.§!"
 BERN_knox_death_sentence_tt:0 "§RУиллард Х. Райт отстранён!§! Декалог Дланор получает полную свободу рук."
 BERN_willard_rebellion_tt:0 "§YЭрика Фурудо изгнана в Море Забвения по § 3348!§! Начинается путь Золотой Истины."
 BERN_power_of_purse_tt:0 "§GСоздаётся экономический модификатор Ведьминского Сеньоража!§!"
 BERN_trillion_coin_minted_tt:0 "§G31 U.S.C. § 5112(k):§! Отчеканена первая платиновая монета в $1 триллион!"
 BERN_pocket_rescission_tt:0 "Открывает механизм Карманной Аннуляции (ICA) в решениях (окно 15 авг — 30 сен)."
 BERN_burn_appropriations_tt:0 "Ассигнования оппозиции сгорают в казне, резко усиливая нашу промышленность."
 BERN_article_five_deconstruction_tt:0 "§YСША остаются главой альянса, но союзники получают дебафф «Славной двусмысленности» (без гарантий и добровольцев)!§!"
 BERN_tea_and_plums_tt:0 "Союзникам в Брюссель отправлена торжественная бандероль с чаем и сливами."
 BERN_schelling_inversion_tt:0 "§RДоктрина Шеллинга перевёрнута:§! Иррациональность становится главным козырем сдерживания."
 BERN_one_in_two_million_tt:0 "§RРазблокированы решения Целевого Ядерного Шантажа великих держав (99.9% уступка / 0.1% удар)!§!"
 BERN_no_planned_harmony_tt:0 "Экзистенциальная Скука сведена к минимуму — Кошачий Ящик готовится к вечности."
 BERN_golden_truth_consensus_tt:0 "§YБернкастель мирно покидает пост, передавая Республику Золотой Истине Уилларда Райта.§!"
 BERN_logic_error_climax_tt:0 "§RНаступает кульминация Кошачьего Ящика (финальный вердикт Ошибки)!§!"
 BERN_fvra_timer_reset_tt:0 "§G210-дневные часы FVRA (5 U.S.C. § 3345) перезапущены на новый срок.§!"
 BERN_mint_trillion_vars_tt:0 "§GКазначейство депонировало платиновую монету на $1 трлн:§! рост долга сбит, стройка ускорена, инфляционный шок учтён в §YЭкономике Сеньоража§!."
 BERN_pocket_rescission_burned_tt:0 "§G1 октября пробило: $45 млрд ассигнований Конгресса сгорели в пользу Белого дома (+1 Civ, +1 Mil, спад инфляции и рейтинга оппозиции)!§!"
 BERN_erika_exiled_tt:0 "§YЭрика Фурудо изгнана в «Море Забвения» по 5 U.S.C. § 3348 и заменена безликим ИО-заместителем!§!"
 BERN_aug_15_sep_30_tt:0 "Текущая дата находится в бюджетном окне Карманной аннуляции (§Y15 августа — 30 сентября§!)"
 BERN_oct_1_burn_tt:0 "Наступила дата обнуления фискального года (§Y1 октября§!)"
 BERN_nato_deconstruction_threat:0 "Деконструкция Статьи 5 НАТО"
 BERN_schelling_limit_threat:0 "Инцидент предела Шеллинга (1 / 2 578 917)"
 BERN_schelling_misfire_threat:0 "Термоядерный срыв стратегии Шеллинга"

 # События (.1 – .24 + .100)
 bernkastel_events.1.t:0 "Игровая Доска провозглашена: Воцарение Ведьмы Чудес"
 bernkastel_events.1.desc:0 "Вопреки всем расчётам политологов, над Белым домом сомкнулась пелена холодного синего тумана. Фредерика Бернкастель — Вечная Путешественница по осколкам вероятности — приняла присягу не перед толпой избирателей, а перед пустым залом Законодательного собрания, превратив саму Конституцию Соединённых Штатов в замкнутую головоломку Кошачьего Ящика.\n\nПозади неё — ледяная Эрика Фурудо с катушкой опечатывающего скотча, Дланор А. Нокс с Красным Клинком и Уиллард Х. Райт, хмуро листающий томик правил Ван Дайна. «Эта страна была слишком скучной, — произносит новая президентша, поправляя синий бант. — Но если мы бросим на стол все тайные статьи и один на два миллиона ядерных шансов… пожалуй, сегодня вечером я не засну»."
 bernkastel_events.1.a:0 "Захлопнуть крышку Ящика. Логическая Ошибка объявляется законом!"
 bernkastel_events.1.b:0 "Отложить фигуры. Понаблюдаем за их суетой с холодной улыбкой."

 bernkastel_events.2.t:0 "Монета в $1 триллион: Суд и ФРС в оцепенении"
 bernkastel_events.2.desc:0 "На стол председателя Федеральной резервной системы опустился плоский платиновый диск размером чуть больше обычного доллара. На реверсе — кошачий профиль и сухая ссылка на раздел 31 U.S.C. § 5112(k), позволяющий Министерству финансов чеканить памятные платиновые монеты любого номинала.\n\n«Зачислите один триллион на главный казначейский счёт до полудня», — тихо распорядилась Бернкастель. У Конгресса нет полномочий остановить эту бухгалтерскую магию, если только Белый дом не признает её ошибкой сам."
 bernkastel_events.2.a:0 "Запечатать хранилище Красной Истиной: триллион на балансе!"
 bernkastel_events.2.b:0 "Засекретить операцию по Navy v. Egan и выкупить оборонный заказ!"

 bernkastel_events.3.t:0 "Дипломатический пакет в Брюссель: «Чая и сушёных слив!»"
 bernkastel_events.3.desc:0 "Когда представители европейских столиц потребовали от Вашингтона немедленных дивизий и ядерного зонтика по Статье 5 Вашингтонского договора, Госдепартамент во главе с Клэр Во Бернардус прислал в штаб-квартиру НАТО аккуратные лакированные шкатулки.\n\nВнутри каждого ящика оказались лишь листья редкого тёмного чая, горсть сушёных слив и типографская открытка: «Соединённые Штаты сочли сии действия необходимыми по духу Статьи 5. Приятного чаепития»."
 bernkastel_events.3.a:0 "Принять посылку от Белого дома... Нас оставили в одиночестве."

 bernkastel_events.4.t:0 "Смертные приговоры Нокс: Текстуализм и изгнание Уилларда"
 bernkastel_events.4.desc:0 "В зале коллегии Министерства юстиции оглашён окончательный вердикт. Опираясь на Десять Заповедей и Меморандум Эшкрофта, Дланор А. Нокс и Эрика Фурудо признали любые попытки искать «Сердце» за пределами сухого текста закона преступлением против Кошачьего Ящика.\n\nИнспектор Уиллард Х. Райт лишён полномочий, его допуски аннулированы по прецеденту Navy v. Egan, а сам он изгнан с Игровой Доски. Архивы PEAD заклеены синим скотчем 47 U.S.C. § 606: власть Красной и Пурпурной Истины становится абсолютной."
 bernkastel_events.4.a:0 "Текстуализм абсолютен: невиновных не существует!"

 bernkastel_events.5.t:0 "Ловушка INS v. Chadha: Вето Конгресса аннулировано"
 bernkastel_events.5.desc:0 "Обе палата Конгресса попытались отменить президентский указ о чрезвычайном положении резолюцией большинства, сославшись на старую редакцию Закона о ЧП (50 U.S.C. § 1622). Юрисконсульты Белого дома встретили это ледяным смехом: согласно прецеденту Верховного суда по делу INS v. Chadha (1983), законодательное вето неконституционно, а значит, отменить чрезвычайные декреты Бернкастель можно только квалифицированным большинством в две трети голосов для преодоления её собственного вето."
 bernkastel_events.5.a:0 "Потребовать двух третей голосов — пусть попробуют собрать!"
 bernkastel_events.5.b:0 "Выпустить дублирующий PEAD-пакет, прежде чем спикер закончит речь."

 bernkastel_events.6.t:0 "Стирание «Void Ab Initio»: Чиновник в Лотке Фигур"
 bernkastel_events.6.desc:0 "Когда 210-дневные часы Закона о вакансиях (5 U.S.C. § 3348) опасно приблизились к красной черте, юридический отдел запустил процедуру Void Ab Initio. Упрямый заместитель министра не просто был уволен — все его подписи за последние полгода были вычеркнуты из истории, а сам он отправился на скамью в Лоток Фигур. С этого мгновения часы FVRA вновь отсчитывают полные 210 дней."
 bernkastel_events.6.a:0 "Опечатать Лоток Фигур и обнулить кадровый счётчик."
 bernkastel_events.6.b:0 "Вместо дублёров вернуть Эрику Фурудо в кресло главы кабинета!"

 bernkastel_events.7.t:0 "Бунт Счётной палаты (GAO) против Белого дома"
 bernkastel_events.7.desc:0 "Генеральный контролёр США и аппарат Счётной палаты (GAO) направили в Федеральный суд иск в соответствии с 2 U.S.C. § 687, требуя разблокировать миллиардные ассигнования Пентагону и штатам. Однако сервера бюджетного управления OMB оказались под запорной пломбой секретности Navy v. Egan."
 bernkastel_events.7.a:0 "Отказать аудиторам в доступе к серверам OMB по мотивам гостайны."
 bernkastel_events.7.b:0 "Принять повестку и утопить иск в процедурных апелляциях."

 bernkastel_events.8.t:0 "Забастовка профсоюзов против статуса «Мебели»"
 bernkastel_events.8.desc:0 "После вступления в силу переклассификации Schedule Policy/Career более сорока тысяч федеральных служащих вышли на забастовку у зданий министерств, протестуя против отмены слушаний в совете MSPB. Председатель профсоюза держит в руках транспарант «Мы не мебель на доске Ведьмы»."
 bernkastel_events.8.a:0 "Признать саботажников уволенными немедленно и заменить их лояльными дублёрами!"
 bernkastel_events.8.b:0 "Отключить координационные чаты и СМИ бастующих по 47 U.S.C. § 606."

 bernkastel_events.9.t:0 "Полночь 1 октября: Бюджет Конгресса сгорел дотла"
 bernkastel_events.9.desc:0 "Настенные часы Казначейства пробили полночь, открыв новый фискальный год. 45-дневное окно Карманной аннуляции (2 U.S.C. § 683) захлопнулось за секунду до окончания срока действия ассигнований. Миллиарды долларов, предназначавшиеся для округов оппозиционных сенаторов, автоматически сгорели и вернулись под контроль Исполнительной ветви."
 bernkastel_events.9.a:0 "Воистину элегантная математика финансового календаря!"

 bernkastel_events.10.t:0 "Пурпурный Трибунал, Акт I: Присяга сенатора Хейлса"
 bernkastel_events.10.desc:0 "Глава бюджетного подкомитета сенатор Хейлс оказался в стеклянной камере закрытого слушания по 18 U.S.C. § 1001. Над столом парит правило Пурпурной Истины: подозреваемый имеет право молчать, но любое сказанное им слово, противоречащее фактам доски, превращается в уголовный состав преступления.\n\nХейлс утверждает Пурпуром: «Я никогда не встречался со связными GAO после 15 августа и не передавал им утечек из OMB!»"
 bernkastel_events.10.a:0 "Зафиксировать Пурпурное заявление в протоколе и прижать Хейлса графиками!"
 bernkastel_events.10.b:0 "Выложить на стол журналы пропусков Белого дома от АНБ!"

 bernkastel_events.11.t:0 "Пурпурный Трибунал, Акт II: Клинок Нокс и Правило № 11"
 bernkastel_events.11.desc:0 "Хейлс мечется как загнанный зверь: он пытается оправдаться существованием «неучтённого тайного связного» в аппарате Минюста. Дланор А. Нокс взметает в воздух алую рапиру Красной Истины, цитируя Декалог Нокс № 8: никаких секретных проходов или выдуманных агентов без доказательств в досье не существует! Тем временем Уиллард Х. Райт предлагает пробить алиби через мотив согласно 11-му правилу Ван Дайна."
 bernkastel_events.11.a:0 "Ударить Красным Клинком: «Незарегистрированных курьеров не существует!»"
 bernkastel_events.11.b:0 "Поручить Уилларду вскрыть прямой банковский мотив сенатора."

 bernkastel_events.12.t:0 "Пурпурный Трибунал, Акт III: Саморазоблачение по § 1001"
 bernkastel_events.12.desc:0 "Опровергнутое со всех сторон алиби Хейлса рушится за пять минут до перерыва. Сенатор срывается на крик и признаётся, что передал конфиденциальную смету лично своему помощнику, рассчитывая остановить октябрьское сожжение бюджета. По статье 18 U.S.C. § 1001 за ложные показания федеральному ведомству его мандат и репутация мертвы."
 bernkastel_events.12.a:0 "Аннулировать полномочия сенатора и запечатать его комитет под Ящик!"
 bernkastel_events.12.b:0 "Обменять помилование Хейлса на подписание новых PEAD-пакетов оппозицией."

 bernkastel_events.13.t:0 "Бунт в Североатлантическом совете: Что значит Статья 5?"
 bernkastel_events.13.desc:0 "Экстренное заседание послов в Брюсселе зашло в логический тупик. Постоянный представитель США Клэр Во Бернардус битый час зачитывает буквальный текст Статьи 5: каждое государство-член оказывает помощь, предпринимая «такие действия, какие оно сочтёт необходимыми». Послы Франции, Польши и Германии требуют чёткого ответа: означает ли это немедленное вступление в ядерную войну за союзников?"
 bernkastel_events.13.a:0 "«Это означает ровно то, что решит Белый дом в день катастрофы!»"
 bernkastel_events.13.b:0 "Обещать «молитвы, дипломатические ноты и неопределённую моральную поддержку»."

 bernkastel_events.15.t:0 "30 сентября: Слушание GAO в Окружном суде Колумбии"
 bernkastel_events.15.desc:0 "За несколько часов до истечения финансового года адвокаты Счётной палаты (GAO) ворвались в дежурный зал Окружного суда, требуя судебного запрета на Карманную аннуляцию президента. Пока судьи листают пятисотстраничные таблицы OMB, песочные часы 45-дневной блокировки стремительно осыпаются."
 bernkastel_events.15.a:0 "Заявить отвод по доктрине политического вопроса (Baker v. Carr)!"
 bernkastel_events.15.b:0 "Обеспечить процедурное затягивание слушаний ровно до полуночи 1 октября."

 bernkastel_events.16.t:0 "Мятеж Совета ФРС против бесконечных триллионных монет"
 bernkastel_events.16.desc:0 "Чеканка третьей по счёту платиновой монеты в $1 триллион стала последней каплей для руководителей Федеральной резервной системы. На закрытом заседании Совет пригрозил заморозить расчётный счёт Казначейства, предупреждая о неминуемом инфляционном срыве долларовой архитектуры."
 bernkastel_events.16.a:0 "Отозвать допуски совета ФРС по Navy v. Egan и продолжать эмиссию!"
 bernkastel_events.16.b:0 "Объявить техническую паузу и стерилизовать часть инфляционного шока."

 bernkastel_events.17.t:0 "Осколок погас: Ведьма Чудес покидает Америку"
 bernkastel_events.17.desc:0 "Это случилось без выстрелов и маршей. Просто однажды утром дверь Овального кабинета распахнулась от порыва сквозняка — на кресле президента осталась лишь остывшая фарфоровая чашка и пара завядших слив. Экзистенциальная Скука достигла ста процентов, и Фредерика Бернкастель перешагнула в следующий фрагмент мироздания.\n\nКошачий Ящик рухнул под тяжестью собственной пустоты. Перед оставленными на произвол судьбы министерствами и рушащейся экономикой стоит один вопрос: кто подберёт руль осиротевшей Республики?"
 bernkastel_events.17.a:0 "«Эта партия больше не родит чуда... Прощай, Америка»."

 bernkastel_events.18.t:0 "Предельная Логическая Ошибка: Ящик сжимается"
 bernkastel_events.18.desc:0 "Индикаторы на Игровой Доске перешли в алую зону: Запланированная Гармония окончательно растоптана, а Логическая Ошибка Кошачьего Ящика стала единственной гравитацией в Вашингтоне. Уровень напряжения в обществе накаляется до предела."
 bernkastel_events.18.a:0 "Затянуть запорный скотч сильнее — ни одна трещина не пройдёт!"
 bernkastel_events.18.b:0 "Стравить избыточное давление через ротацию ведомственной мебели."

 bernkastel_events.19.t:0 "Золотая Истина: Бернкастель прощается с Доской"
 bernkastel_events.19.desc:0 "Впервые за годы в Овальном кабинете прозвучал не треск разрываемого права, а спокойное признание поражения в равном споре. Уиллард Х. Райт положил перед Ведьмой Чудес законченную партию: Кошачий Ящик вскрыт не насилием, а любовью к Сердцу людей и честностью правил Ван Дайна.\n\nБернкастель на секунду улыбнулась по-настоящему, оставила на столе золотой ключ к переходному правительству и шагнула за грань. Страна возвращается к конституционному равновесию."
 bernkastel_events.19.a:0 "Принять полномочия Арбитра Золотой Истины и вернуть выборный строй."

 bernkastel_events.20.t:0 "Инверсия Шеллинга: Граница 1 / 2 578 917"
 bernkastel_events.20.desc:0 "После серии провокационных пусков стратегических бомбардировщиков по маршруту «Сломанной Стрелы» вражеские штабы впали в паралич. Их аналитики просчитали психологический профиль Бернкастель и поняли ужасную истину: она действительно может нажать на кнопку просто из интереса к вероятности в одну двухмиллионную."
 bernkastel_events.20.a:0 "Их страх перед нашим безумием ценнее тысячи новых дивизий!"

 bernkastel_events.21.t:0 "Дилемма Лямбдадельты: 2 578 916 против 1"
 bernkastel_events.21.desc:0 "В штаб верховного командования поступил зашифрованный ультиматум из Вашингтона. Ведьма Осколков заблокировала протоколы раннего предупреждения и поставила мир на грань ядерной случайности. Шанс нашего выживания при отказе подчиниться равен ровно единице на два с половиной миллиона."
 bernkastel_events.21.a:0 "Мы не можем рисковать гибелью цивилизации. Принять условия ультиматума."
 bernkastel_events.21.b:0 "Ни шагу назад! Мы не поддадимся на безумный блеф Ведьмы — к оружию!"

 bernkastel_events.22.t:0 "РОКОВОЙ СРЫВ 0.1%: Термоядерный инцидент Шеллинга!"
 bernkastel_events.22.desc:0 "Кости вероятности совершили невозможное — выпала та самая одна тысячная! Вместо отступления по ту сторону океана радарные посты зафиксировали срыв предохранителей. Стратегия контролируемого безумия перешагнула точку невозврата: небо рассекла белая вспышка!"
 bernkastel_events.22.a:0 "Боги и ведьмы больше не остановят цепную реакцию!"

 bernkastel_events.23.t:0 "Истечение 210 дней FVRA (5 U.S.C. § 3348)!"
 bernkastel_events.23.desc:0 "Один из ключевых министров, назначенный в обход Сената как Исполняющий обязанности, превысил установленный законом лимит в 210 дней. Апелляционный суд готовит иск о признании всех подписанных им директив юридически ничтожными."
 bernkastel_events.23.a:0 "Попытаться залатать дело фиктивным разделением обязанностей."
 bernkastel_events.23.b:0 "Сбросить нарушителя в Лоток Фигур по Void Ab Initio!"

 bernkastel_events.24.t:0 "Бунт Уилларда: «Без Сердца нет даже загадки!»"
 bernkastel_events.24.desc:0 "При поддержке умеренных судей и региональных прокуроров Уиллард Х. Райт разорвал опечатывающий скотч Эрики Фурудо и выставил на всеобщее обозрение архивы секретных PEAD-директив. Начался необратимый дрейф Игровой Доски к развязке через Золотую Истину."
 bernkastel_events.24.a:0 "Раскрыть карты перед обществом и готовить финал Золотой Истины!"

 bernkastel_events.100.t:0 "Республика Логической Ошибки: Закрытый Вечно Ящик"
 bernkastel_events.100.desc:0 "Последняя искра сопротивления погасла. Суды распущены в режим вечного ИО, Конгресс превратился в музейную витрину, а экономика и ядерное сдерживание вращаются вокруг прихоти одного Белого дома. Кошачий Ящик захлопнут идеально — ни одно наблюдение снаружи никогда не опровергнет вечную власть Фредерики Бернкастель.\n\n«Ну вот, мы победили, — шепчет она в полумраке Овального кабинета. — И всё же… неужели это конец партии?»"
 bernkastel_events.100.a:0 "Запечатать Кошачий Ящик навечно: Америка принадлежит Ведьме Чудес!"
 bernkastel_events.100.b:0 "Если загадок не осталось... тогда я просто ухожу из этого фрагмента."

