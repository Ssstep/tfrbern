 BERN_TEL_LOGIC_ERROR_TT:0 "§MЛогическая Ошибка Кошачьего Ящика§!\nТекущий прогресс замыкания: §M[?BERN_logic_error_progress|0]%§!\nБаффы: §G+25% шифрование§!, §G+20% подчинение§!, §G-20% сопротивление§!. При достижении §C100%§! происходит абсолютная фиксация правления Ведьмы."

