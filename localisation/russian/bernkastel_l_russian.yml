 # Решения и миссии
 BERN_invoke_miracle_shard:0 "Призвать Осколок Чудес: Воцарение Бернкастель"
 BERN_invoke_miracle_shard_desc:0 "Время разорвать сценарий обычной политики и вытащить Ведьму Чудес на президентский подиум."
 BERN_existential_boredom_tick:0 "Прилив Экзистенциальной Скуки"
 BERN_existential_boredom_tick_desc:0 "Каждые 30 дней пассивность повышает скуку Бернкастель и сдвигает BoP влево. На 100% Ведьма уйдёт."
 BERN_fvra_210_day_statutory_clock:0 "Лимит 210 дней FVRA (5 U.S.C. § 3345)"
 BERN_fvra_210_day_statutory_clock_desc:0 "Срок полномочий Исполняющих обязанности министров истекает через 210 дней. Сбросьте таймер перераспределением неэксклюзивных обязанностей или чисткой Void Ab Initio!"
 BERN_execute_pocket_rescission:0 "45-дневный отсчёт Карманной Аннуляции (2 U.S.C. § 683)"
 BERN_execute_pocket_rescission_desc:0 "Счётчик 45-дневной задержки расхода средств по ICA. Когда часы пробьют полночь финансового года, неосвоенные миллиарды сгорят в казне!"
 BERN_subdelegate_non_exclusive_duties:0 "Перераспределить «неэксклюзивные обязанности»"
 BERN_subdelegate_non_exclusive_duties_desc:0 "Передаём де-факто полномочия ИО на уровень ниже, чтобы формально обойти лимит 210 дней по 5 U.S.C. § 3345 и сбросить часы FVRA."
 BERN_expand_schedule_policy_furniture:0 "Обратить ведомства в мебель (Schedule Policy/Career)"
 BERN_expand_schedule_policy_furniture_desc:0 "Массовая переклассификация карьерных клерков в политические должности без права обжалования в MSPB."
 BERN_execute_void_ab_initio_purge:0 "Чистка Void Ab Initio (Сброс в Лоток Фигур)"
 BERN_execute_void_ab_initio_purge_desc:0 "Признать предыдущие акты ничтожными задним числом, сбросить часы FVRA и перетасовать кабинет Белого дома."
 BERN_forge_red_truth_compilation:0 "Опубликовать директивы Красной Истины"
 BERN_forge_red_truth_compilation_desc:0 "Пресечь любые альтернативные прочтения актов Минюста юридически неопровержимой Красной Истиной."
 BERN_conduct_purple_truth_interrogation:0 "Трибунал Пурпурных утверждений (18 U.S.C. § 1001)"
 BERN_conduct_purple_truth_interrogation_desc:0 "Вызвать строптивого сенатора на перекрёстный допрос в 3 этапа и поймать его на ложных показаниях."
 BERN_apply_erika_duct_tape_606:0 "Заклеить утечки скотчем по 47 U.S.C. § 606"
 BERN_apply_erika_duct_tape_606_desc:0 "Эрика Фурудо опечатывает узлы связи и архивы ОВБ от посторонних наблюдателей."
 BERN_unseal_pead_and_main_core_batch:0 "Вскрыть пакет PEADs и прогнать базу MAIN CORE"
 BERN_unseal_pead_and_main_core_batch_desc:0 "Ввести в действие очередную партию президентских директив ЧП и переиндексировать миллионы досье граждан."
 BERN_suppress_willard_van_dine_heresy:0 "Подавить ересь «Сердца» (Правила Ван Дайна)"
 BERN_suppress_willard_van_dine_heresy_desc:0 "Остудить пыл Уилларда Райта и подавить внутреннее сопротивление судов."
 BERN_mint_additional_trillion:0 "Отчеканить дополнительную монету в $1 трлн"
 BERN_mint_additional_trillion_desc:0 "Применить 31 U.S.C. § 5112(k) для мгновенной закачки триллиона долларов в казначейский счёт."
 BERN_initiate_august_pocket_rescission:0 "Запустить «Карманную аннуляцию» (авг–сен)"
 BERN_initiate_august_pocket_rescission_desc:0 "Доступно строго с 15 августа по 30 сентября: запускает 45-дневную миссию заморозки ассигнований, которые сгорят 1 октября, сокрушая оппозицию и строя заводы."
 BERN_escalate_schelling_brinkmanship:0 "Учения «Сломанная Стрела» (Эскалация Шеллинга)"
 BERN_escalate_schelling_brinkmanship_desc:0 "Повысить ставку непредсказуемости ядерной доктрины США: 85% шокового триумфа против 15% кризиса срыва."
 BERN_bop_expose_scandals:0 "Опубликовать компромат на Конгресс"
 BERN_bop_expose_scandals_desc:0 "Ударить по Запланированной Гармонии через выброс грязного белья Капитолия, сдвигая BoP к Логической Ошибке."
 BERN_bop_escalate_catbox:0 "Запечатать новую директиву Кошачьего Ящика"
 BERN_bop_escalate_catbox_desc:0 "Расширить сферу закрытого нормотворчества, резко отбрасывая баланс вправо."
 BERN_bop_feigned_normality:0 "Сыграть «Конституционную нормальность»"
 BERN_bop_feigned_normality_desc:0 "Видимая уступка прессе и судам ради снижения трения и сдвига BoP влево."
 BERN_bop_van_dine_amnesty:0 "Амнистия Честной Игры (Ван Дайн)"
 BERN_bop_van_dine_amnesty_desc:0 "Позволить инспектору Уилларду Райту снять часть токсичных мер для стабилизации тыла."

 # Фокусы и их описания
 BERN_proclaim_the_gameboard:0 "Провозглашение Игровой Доски"
 BERN_proclaim_the_gameboard_desc:0 "Америка больше не является обычным государством — это партия, расставленная на Игровой Доске Ведьмы Чудес."
 BERN_seal_the_doors:0 "Герметичная Запертая Комната"
 BERN_seal_the_doors_desc:0 "Все входы и окна Белого дома опечатаны политическим скотчем Эрики Фурудо: ничто не войдёт и не выйдет без санкции."
 BERN_communications_act_706:0 "Рубильник 47 U.S.C. § 606"
 BERN_communications_act_706_desc:0 "Активируем чрезвычайное положение в сфере связи 1934 года, забирая контроль над кабелями и трафиком."
 BERN_national_emergencies_act:0 "Акт о Чрезвычайных Полномочиях § 1621"
 BERN_national_emergencies_act_desc:0 "Запускаем каскад президентских объявлений ЧП, ломая двухпалатное вето Конгресса оговоркой INS v. Chadha."
 BERN_unseal_peads:0 "Вскрыть 56 секретных PEADs"
 BERN_unseal_peads_desc:0 "Доктрины экстренного реагирования, о которых десятилетиями знали лишь единицы, становятся открытым инструментом правления."
 BERN_main_core_index:0 "Реестр MAIN CORE (8 миллионов досье)"
 BERN_main_core_index_desc:0 "Мобилизационный список неблагонадёжных превращается в живую базу данных АНБ по всей стране."
 BERN_fvra_loophole:0 "Лазейка FVRA (5 U.S.C. § 3345)"
 BERN_fvra_loophole_desc:0 "Никаких утверждений в Сенате: кабинет комплектуется вечной ротацией Исполняющих обязанности."
 BERN_neutralize_senate_confirmation:0 "Обойти утверждение Сената"
 BERN_neutralize_senate_confirmation_desc:0 "Переводим ключевые посты в статус «неэксклюзивных функций», чтобы Сенат никогда больше не смел вмешиваться."
 BERN_nullify_25th_amendment:0 "Паралич 25-й Поправки"
 BERN_nullify_25th_amendment_desc:0 "Кабинет состоит из лояльной мебели и ИО, поэтому никакой бунт министров не отстранит Гейммастера."
 BERN_schedule_policy_career:0 "Превращение госаппарата в Мебель"
 BERN_schedule_policy_career_desc:0 "Госслужащие категорий Policy/Career лишаются иммунитета от увольнения и превращаются в безмолвных пешек."
 BERN_cler_vessel_spokesperson:0 "Сосуд Клэр Во Бернардус"
 BERN_cler_vessel_spokesperson_desc:0 "Назначить безупречную Клэр голосом Белого дома: ни одна неудобная интонация не прорвётся в эфир."
 BERN_void_ab_initio_purges:0 "Принцип Void Ab Initio (§ 3348)"
 BERN_void_ab_initio_purges_desc:0 "Неугодные чиновники не увольняются — их полномочия объявляются никогда не существовавшими от сотворения мира."
 BERN_dlanor_attorney_general:0 "Дланор Нокс в кресле Генпрокурора"
 BERN_dlanor_attorney_general_desc:0 "Хранительница Красного Клинка возглавляет Министерство юстиции США."
 BERN_ashcroft_mandate:0 "Меморандум Эшкрофта 2.0"
 BERN_ashcroft_mandate_desc:0 "Расширяем доктрину прокурорского усмотрения, снимая ограничения на федеральное преследование."
 BERN_navy_v_egan_monopoly:0 "Монополия Navy v. Egan"
 BERN_navy_v_egan_monopoly_desc:0 "Верховный суд сам признал за президентом абсолютную власть над гостайной и допусками. Пришло время лишить допусков всех врагов."
 BERN_purple_truth_trials:0 "Трибунал Пурпурной Истины (18 U.S.C. § 1001)"
 BERN_purple_truth_trials_desc:0 "Ложь или неточность под Пурпурным допросом немедленно карается как тяжкое федеральное преступление."
 BERN_willard_audit:0 "Ревизия Уилларда Х. Райта"
 BERN_willard_audit_desc:0 "Бывший Инспектор Небес вносит смуту: требует соблюдения «Честной Игры» и 20 правил Ван Дайна даже в Кошачьем Ящике."
 BERN_knox_death_sentences:0 "Приговоры Декалога Нокс"
 BERN_knox_death_sentences_desc:0 "Окончательно выбрать жёсткий текстуализм Эрики и Дланор: Уиллард изгоняется, а Декалог подавляет любую оппозицию."
 BERN_willard_rebellion_for_heart:0 "Бунт Уилларда: Ради Сердца"
 BERN_willard_rebellion_for_heart_desc:0 "Инспектор Райт поднимает судебный бунт против бездушия Ящика: Эрика изгоняется по § 3348, а 20 правил Ван Дайна возвращаются в силу."
 BERN_power_of_the_purse_shatter:0 "Сокрушить «Власть Кошелька»"
 BERN_power_of_the_purse_shatter_desc:0 "Конгресс веками держал президента за горло бюджетом. Ведьма перерезает этот поводок Статьёй II и статутом о чеканке."
 BERN_mint_the_trillion_coin:0 "Платиновая монета в $1 триллион"
 BERN_mint_the_trillion_coin_desc:0 "31 U.S.C. § 5112(k) даёт Министру финансов неограниченное право чеканить платиновые монеты любого номинала. Депонируем монету в ФРС!"
 BERN_pocket_rescissions:0 "Арсенал Карманной Аннуляции (ICA)"
 BERN_pocket_rescissions_desc:0 "Манипулируем 45-дневным окном Закона об импаундменте бюджетов, превращая финансовый календарь в ловушку для Сената."
 BERN_burn_the_appropriations:0 "Сожжение Бюджета 1 Октября"
 BERN_burn_the_appropriations_desc:0 "В полночь нового фискального года замороженные миллиарды превращаются в прах для Капитолия и в чистую власть для нас."
 BERN_article_five_deconstruction:0 "Деконструкция Статьи 5 НАТО"
 BERN_article_five_deconstruction_desc:0 "Отказываться от лидерства в НАТО глупо: гораздо веселее оставить за собой трон, но переписать гарантии на «действия по усмотрению»."
 BERN_tea_and_plums_diplomacy:0 "Поставка «Чая и сушёных слив»"
 BERN_tea_and_plums_diplomacy_desc:0 "Формально Статья 5 выполнена! Союзники под русскими ракетами получают от США элитный пакет с чаем и сливами."
 BERN_schelling_inversion:0 "Инверсия Стратегии Шеллинга"
 BERN_schelling_inversion_desc:0 "Рациональный игрок блефует. Бернкастель доказывает миру, что её рука на кнопке не дрогнет даже при шансе срыва 1 к 2 578 917."
 BERN_one_in_two_million:0 "Вероятность 1 / 2 578 917"
 BERN_one_in_two_million_desc:0 "Разблокирует целевой ядерный шантаж сверхдержав. Посмотрим, у кого нервы выдержат 99.9%-ю партию в русскую рулетку."
 BERN_eradicate_planned_harmony:0 "Стереть «Запланированную Гармонию»"
 BERN_eradicate_planned_harmony_desc:0 "Никаких мягких выходов и возвратов к норме. Мы уничтожаем сам корень Скуки, сжигая остатки демократических сдержек."
 BERN_golden_truth_consensus:0 "Золотая Истина Конституции"
 BERN_golden_truth_consensus_desc:0 "Уиллард Райт побеждает в споре с Ведьмой: Бернкастель уходит с улыбкой, оставляя Америке обновлённый мир Золотой Истины."
 BERN_logic_error_republic:0 "Республика Логической Ошибки"
 BERN_logic_error_republic_desc:0 "Крышка Кошачьего Ящика захлопнута изнутри навсегда. Время остановилось на идеальной ведьмовской диктатуре."

 # Подсказки (Custom Tooltips) и Угрозы
 BERN_inauguration_tt:0 "§CВедьма Чудес Фредерика Бернкастель возглавит Америку, откроет Дерево Фокусов Кошачьего Ящика, баланс сил и Интерактивную Доску Решений.§!"
 BERN_gameboard_inaugurated_tt:0 "§CАктивируются динамические модификаторы Конституции Кошачьего Ящика и Телеметрии Доски.§!"
 BERN_erika_duct_tape_tt:0 "§CЭрика Фурудо опечатывает запертую комнату: §Gукрепляется шифрование и падает экзистенциальная скука.§!§!"
