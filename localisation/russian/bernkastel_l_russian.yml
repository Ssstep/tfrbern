l_russian:
 # Персонажи и описания
 USA_frederica_bernkastel:0 "Фредерика Бернкастель"
 USA_frederica_bernkastel_desc:0 "Ведьма Чудес, материализовавшаяся в Овальном кабинете на руинах Второго Американского конституционного порядка. Она управляет Соединёнными Штатами как герметичным «Кошачьим ящиком» из процедурных лазеек: покуда ни одна камера не видит реального кабинета, её власть абсолютна и необратима."
 POLITICS_FREDERICA_BERNKASTEL_DESC:0 "Ведьма Чудес, материализовавшаяся в Овальном кабинете на руинах Второго Американского конституционного порядка. Она рассматривает Конституцию США не как общественный договор, а как свод логических правил запертой комнаты: пока суды и Конгресс спорят о полномочиях Исполняющих обязанности и засекреченных PEAD-директив, сама реальность переписывается Синей и Красной Истиной."
 USA_erika_furudo:0 "Эрика Фурудо"
 USA_dlanor_a_knox:0 "Дланор А. Нокс"
 USA_willard_h_wright:0 "Уиллард Х. Райт"
 POLITICS_WILLARD_H_WRIGHT_DESC:0 "Бывший Главный Инспектор Высшего Суда Небес, пронесший сквозь развал Игровой Доски уважение к человеческому сердцу и двадцать правил Ван Дайна. Оказавшись на вершине рухнувшей или примирённой системы, он пытается сшить обрывки права."
 USA_clair_vaux_bernardus:0 "Клэр Во Бернардус"
 POLITICS_CLAIR_VAUX_BERNARDUS_DESC:0 "Идеальная декламаторша брифингов, унаследовавшая руины Кошачьего Ящика как временная распорядительница Белого дома после исчезновения своей хозяйки."

 # Черты лидеров и министров
 trait_witch_of_miracles:0 "Ведьма Чудес"
 trait_witch_of_miracles_desc:0 "Абсолютное манипулирование вероятностью: если шанс политического переворота или термоядерной эскалации не равен нулю, Бернкастель вытянет его со стопроцентной точностью."
 trait_gamemaster_of_shards:0 "Гейммастер Осколка"
 trait_gamemaster_of_shards_desc:0 "Федеральная бюрократия переведена в режим закрытого сценария, где оппоненты не вправе даже открыть рот без Красной Истины."
 trait_cold_textualist:0 "Холодный текстуалист"
 trait_cold_textualist_desc:0 "Безжалостное прочтение статутов: ни одна буква 5 U.S.C. и Статьи II не трактуется в пользу традиции, если закон допускает лазейку."
 trait_erika_white_house_counsel:0 "Юрисконсульт Кошачьего Ящика"
 trait_erika_white_house_counsel_desc:0 "Эрика Фурудо заклеивает скотчем каждую утечку в Вашингтоне, превращая Белый дом в безупречную запертую комнату."
 trait_dlanor_attorney_general:0 "Генеральный прокурор Декалога"
 trait_dlanor_attorney_general_desc:0 "Дланор А. Нокс рубит Красным Клинком по любому притязанию законодателей на «секретные лазейки» в уголовных обвинениях."
 trait_willard_inspector_general:0 "Инспектор Двадцати Правил"
 trait_willard_inspector_general_desc:0 "Уиллард Х. Райт проверяет каждый указ на соответствие «Честной Игре» Ван Дайна — заноза в боку Ведьмы."
 trait_clair_press_secretary:0 "Вестница Запертой Комнаты"
 trait_clair_press_secretary_desc:0 "Клэр Во Бернардус зачитывает перед репортёрами готовые фрагменты Красной Истины с ледяным безмятежием."
 trait_golden_truth_arbiter:0 "Арбитр Золотой Истины"
 trait_golden_truth_arbiter_desc:0 "Заменил ведьмовской террор Кошачьего Ящика консенсусом права, восстановив доверие к судебной системе."
 trait_reluctant_caretaker:0 "Вынужденный смотритель"
 trait_reluctant_caretaker_desc:0 "Временный глава разваливающейся администрации, которому достались лишь пепел и долги исчезнувшей Ведьмы."

 # Динамические модификаторы
 BERN_catbox_constitution_dm:0 "Конституция Кошачьего Ящика"
 BERN_catbox_constitution_dm_desc:0 "Единая система экстраординарных указов (Статья II, FVRA § 3345, PEADs и цензура связи § 606), динамически растущая по мере замыкания Игровой Доски."
 BERN_witch_economics_dm:0 "Экономика Ведьминского Сеньоража"
 BERN_witch_economics_dm_desc:0 "Платиновая монета по 31 U.S.C. § 5112(k) и Карманная аннуляция по 2 U.S.C. § 683. Каждый отчеканенный триллион ускоряет стройку, но раскручивает инфляционный шок."
 BERN_gameboard_telemetry_dm:0 "Телеметрия Игровой Доски"
 BERN_gameboard_telemetry_dm_desc:0 "Суммарный эффект состояния Доски: Экзистенциальная скука (§C[?BERN_existential_boredom|0]%§!), прогресс Логической Ошибки (§R[?BERN_logic_error_progress|0]%§!) и трение сопротивления Уилларда (§Y[?BERN_willard_heart_resistance|0]%§!)."

 # Баланс сил (BoP)
 BERN_boredom_bop:0 "Экзистенциальная Скука vs Логическая Ошибка"
 BERN_planned_harmony_side:0 "Запланированная гармония (Экзистенциальная скука)"
 BERN_logic_error_side:0 "Логическая Ошибка (Кошачий Ящик)"
 BERN_equilibrium_range:0 "Хрупкое равновесие фрагмента"
 BERN_stagnation_range:0 "Бюрократическая апатия"
 BERN_existential_apathy_range:0 "Опасное приближение Скуки"
 BERN_witch_departure_range:0 "Абсолютная Скука (Уход Ведьмы)"
 BERN_procedural_trap_range:0 "Запертая процедура Статьи II"
 BERN_hermetic_catbox_range:0 "Герметичный Кошачий Ящик"
 BERN_absolute_logic_error_range:0 "Абсолютная Логическая Ошибка"

 # Национальные духи и министры
 USA_catbox_republic:0 "Республика Кошачьего Ящика"
 USA_catbox_republic_desc:0 "Ни одна парламентская комиссия и ни один судья не вправе приподнять крышку Овального кабинета."
 USA_gameboard_administration:0 "Администрация Игровой Доски"
 USA_gameboard_administration_desc:0 "Вся федеральная машина переведена на режим закрытого судебного состязания Ведьмы."
 USA_schedule_policy_furniture:0 "Министерская мебель (Schedule Policy)"
 USA_schedule_policy_furniture_desc:0 "Миллионы карьерных госслужащих лишены судебной защиты MSPB и превращены в безмолвную мебель Доски."
 USA_red_truth_monopoly:0 "Монополия Красной Истины"
 USA_red_truth_monopoly_desc:0 "Доктрина Navy v. Egan возведена в абсолют: допуски секретности отбираются росчерком пера Дланор Нокс."
 USA_platinum_seigniorage:0 "Платиновый сеньораж Казначейства"
 USA_platinum_seigniorage_desc:0 "31 U.S.C. § 5112(k) позволяет штамповать платиновые монеты номиналом в триллион долларов, минуя потолок госдолга Конгресса."
 USA_pocket_rescissions_spirit:0 "Практика карманных аннуляций"
 USA_pocket_rescissions_spirit_desc:0 "Белый дом удерживает деньги последние 45 дней финансового года, пока ассигнования не сгорают 1 октября."
 USA_the_threat_that_leaves_chance:0 "Угроза, оставляющая место случаю"
 USA_the_threat_that_leaves_chance_desc:0 "Инверсия стратегии Томаса Шеллинга: США побеждают в ядерном шантаже именно потому, что ведьма способна выбросить 0.1%-ю катастрофу."
 USA_existential_boredom_threat:0 "Угроза экзистенциальной скуки"
 USA_existential_boredom_threat_desc:0 "Если Америка станет слишком предсказуемой, Бернкастель зевнёт и просто покинет этот осколок реальности."
 BERN_knox_inquisition_idea:0 "Инквизиция Декалога Нокс"
 BERN_knox_inquisition_idea_desc:0 "Радикальный союз Эрики Фурудо и Дланор А. Нокс. Полное доминирование Красного Клинка над контрразведкой и внутренним сыском."
 BERN_willard_golden_rule_idea:0 "Двадцать правил Ван Дайна"
 BERN_willard_golden_rule_idea_desc:0 "Уиллард Райт навязал Белому дому «Честную Игру»: произвол ограничен, а лояльность населения растёт без дубинок."
 BERN_glorious_ambiguity_nato:0 "«Славная двусмысленность» Статьи 5"
 BERN_glorious_ambiguity_nato_desc:0 "Вашингтон формально возглавляет альянс, но заменил автоматическую ядерную гарантию правом отправить коробку чая и сушёных слив."
 BERN_schelling_coerced_idea:0 "Капитуляция перед пределом Шеллинга"
 BERN_schelling_coerced_idea_desc:0 "Правительство пошло на односторонние уступки Вашингтону под давлением иррационального ядерного шанса Бернкастель."
 BERN_erika_furudo_hog:0 "ИО Главы кабинета: Эрика Фурудо"
 BERN_erika_furudo_hog_desc:0 "Советница, назначенная по лазейке FVRA в качестве «интеллектуальной насильницы» Белого дома."
 BERN_acting_substitute_hog:0 "Временный заместитель-дублёр (FVRA § 3345)"
 BERN_acting_substitute_hog_desc:0 "Безликий клерк-заместитель, удерживающий печать министра, пока Эрика пережидает изгнание или ротацию 210-дневного срока."
 BERN_dlanor_a_knox_sec:0 "Генпрокурор: Дланор А. Нокс"
 BERN_dlanor_a_knox_sec_desc:0 "Главный Инквизитор Ереси в кресле Министра юстиции США."
 BERN_clair_vaux_bernardus_for:0 "Пресс-секретарь Госдепа: Клэр Во Бернардус"
 BERN_clair_vaux_bernardus_for_desc:0 "Читательница сценария, превращающая каждый внешнеполитический брифинг в неизбежный театр ведьм."
 BERN_erika_furudo_int:0 "Директор АНБ / MAIN CORE: Эрика Фурудо"
 BERN_erika_furudo_int_desc:0 "Ведёт тотальную слежку и заклеивает каждую брешь цифровой запертой комнаты."
 BERN_willard_h_wright_theorist:0 "Теоретик права: Уиллард Х. Райт"
 BERN_willard_h_wright_theorist_desc:0 "Вынужденный советник по конституционному соответствию, отстаивающий «Сердце» закона."

 # Категории решений
 BERN_shard_summon_category:0 "Осколок Вероятности: Призыв Ведьмы"
 BERN_shard_summon_category_desc:0 "Аномальное искажение политического пространства Соединённых Штатов. Призыв Ведьмы Чудес отменит привычный ход выборов и развернёт партию на Игровой Доске."
 BERN_gameboard_category:0 "Игровая Доска Бернкастель"
 BERN_gameboard_category_desc:0 "§M=== АРХИТЕКТУРА ИСПОЛНИТЕЛЬНОЙ ВЛАСТИ: КОШАЧИЙ ЯЩИК ===§!\n§7Управление государственным аппаратом через три столпа юрисдикции, Лоток фигур Schedule Policy/Career и Матрицу Доски. Вся подробная телеметрия состояний и эффектов доступна при наведении на приборы и портреты.§!"
 BERN_balance_of_power_category:0 "Экзистенциальный баланс: Гармония vs Ошибка"
 BERN_balance_of_power_category_desc:0 "Балансирование между Запланированной Гармонией (которая усыпляет Ведьму Чудес до 100% Скуки и разрушает режим) и Абсолютной Логической Ошибкой Кошачьего Ящика."
 BERN_schelling_brinkmanship_category:0 "Инверсия Шеллинга: Целевой ядерный шантаж"
 BERN_schelling_brinkmanship_category_desc:0 "Использование вероятности 1 к 2 578 917 против великих держав: 99.9% шанс капитуляции оппонента против 0.1% шанса немедленного термоядерного срыва."

 # Интерфейс Архитектуры Власти (Scripted GUI)
 BERN_GUI_HEADER_TITLE:0 "АРХИТЕКТУРА ИСПОЛНИТЕЛЬНОЙ ВЛАСТИ ВЕДЬМЫ ЧУДЕС"
 BERN_GUI_GAMEMASTER_TT:0 "§CГейммастер: Фредерика Бернкастель§!\nПравящая Ведьма Чудес. Управляет страной через ИО, PEADs и ядерную асимметрию."
 BERN_GUI_BOREDOM_READOUT:0 "§CСкука: [?BERN_existential_boredom|0]%§!\n[BERN_GetBoredomBar]"
 BERN_GUI_BOREDOM_TT:0 "При достижении §R100%§! Экзистенциальной Скуки (или уходе BoP в левый полюс) Бернкастель бросит Америку, и власть рухнет."
 BERN_GUI_LOGIC_ERROR_READOUT:0 "§RОшибка: [?BERN_logic_error_progress|0]%§!\n[BERN_GetLogicErrorBar]"
 BERN_GUI_LOGIC_ERROR_TT:0 "Прогресс абсолютного замыкания США в Логическую Ошибку Кошачьего Ящика."

 # Столп I: Эрика Фурудо
 BERN_GUI_ERIKA_LABEL:0 "§CЭРИКА ФУРУДО§!"
 BERN_GUI_ERIKA_METER_TEXT:0 "§CСкотч § 606: [?BERN_duct_tape_seal_integrity|0]%§!"
 BERN_GUI_ERIKA_TT:0 "§CЮрисконсульт Эрика Фурудо§!\nКуратор §Y47 U.S.C. § 606§! и герметизации Игровой Доски.\nЦелостность скотча: §C[?BERN_duct_tape_seal_integrity|0]%§!"
 BERN_GUI_ERIKA_VOIDED_TT:0 "§R[ИЗГНАНА В МОРЕ ЗАБВЕНИЯ ПО 5 U.S.C. § 3348]§!\nЭрика Фурудо стёрта с Доски после бунта Уилларда Райта."
 BERN_GUI_BTN_DUCT_TAPE:0 "Опечатать скотчем"
 BERN_GUI_BTN_DUCT_TAPE_TT:0 "§CГерметизация скотчем Эрики (47 U.S.C. § 606)§!\nСтоимость: §Y25 полит. власти§!\n+10% целостность скотча, +3% к Логической Ошибке, -4% скуки, укрепление шифрования и сдвиг BoP вправо."

 # Столп II: Дланор А. Нокс
 BERN_GUI_DLANOR_LABEL:0 "§RДЛАНОР А. НОКС§!"
 BERN_GUI_DLANOR_METER_TEXT:0 "§RКрасная Истина: [?BERN_red_truth_dossiers|0] досье§!"
 BERN_GUI_DLANOR_TT:0 "§RГенпрокурор Дланор А. Нокс§!\nИсполнительница Красной Истины и §MNavy v. Egan§!.\nДосье Красной Истины в архиве: §R[?BERN_red_truth_dossiers|0]§!"
 BERN_GUI_BTN_KNOX_VERDICT:0 "Приговор Декалога"
 BERN_GUI_BTN_KNOX_VERDICT_TT:0 "§RПриговор Декалога Нокс (Красная Истина)§!\nСтоимость: §Y1 досье Истины§!\n+1 пойманное противоречие в Конгрессе, -8% антимагического токсина, +4% к Логической Ошибке и сдвиг BoP вправо."

 # Столп III: Уиллард Х. Райт
 BERN_GUI_WILLARD_LABEL:0 "§YУИЛЛАРД Х. РАЙТ§!"
 BERN_GUI_WILLARD_METER_TEXT:0 "§YАудит Сердца: [?BERN_willard_heart_resistance|0]%§!"
 BERN_GUI_WILLARD_TT:0 "§YИнспектор Уиллард Х. Райт§!\nСтраж 20 правил Ван Дайна и «Честной Игры».\nУгроза внутреннего бунта: §R[?BERN_willard_heart_resistance|0]%§!"
 BERN_GUI_WILLARD_VOIDED_TT:0 "§R[ВЫЧИЩЕН]§!\nУиллард Райт отстранён Меморандумом Эшкрофта и трибуналом Нокс."
 BERN_GUI_BTN_VAN_DINE:0 "Аудит Ван Дайна"
 BERN_GUI_BTN_VAN_DINE_TT:0 "§YУступка Ван Дайна (Правила Детектива)§!\nСтоимость: §Y30 полит. власти§!\n-10% антимагического токсина, -2% инфляции, +2% стабильности, +6% скуки, сдвиг BoP влево."

 # Базовый Ярус: Schedule Policy/Career и Лоток Фигур
 BERN_GUI_TRAY_TITLE:0 "§MФЕДЕРАЛЬНАЯ СЛУЖБА SCHEDULE F — ЛОТОК ДЛЯ ФИГУР§!"
 BERN_GUI_CLAIR_TT:0 "§MКлер Вокс Бернардус§!\nХранительница Лотка для фигур и Главный администратор аппарата Белого дома."
 BERN_GUI_METER_FURNITURE_TEXT:0 "§YМебель Sch. F:§! [BERN_GetFurnitureBar] §Y[?BERN_schedule_f_furniture_ratio|0]%§!"
 BERN_GUI_METER_CABINET_TEXT:0 "§CИО Кабинета:§!   [BERN_GetCabinetBar] §C[?BERN_acting_cabinet_slots|0]/15§!"
 BERN_GUI_METER_VOID_TEXT:0 "§MЛоток Фигур:§!   [BERN_GetVoidBar] §M[?BERN_void_ab_initio_charges|0] орд.§!"
 BERN_GUI_FURNITURE_TT:0 "§YСтатус «Мебели» (Schedule Policy/Career)§!\nДоля чиновников, переведённых в категорию безмолвных пешек без защиты от увольнения (+Стабильность, +Эффективность фабрик). Пополняется решениями и сбросом в Лоток."
 BERN_GUI_FVRA_ACTING_TT:0 "§CИсполняющие обязанности министров (5 U.S.C. § 3345 FVRA)§!\nКоличество министерских постов, занятых в обход Сената. Лимит полномочий каждого ИО — 210 дней."
 BERN_GUI_FVRA_TRAY_TT:0 "§MЛоток фигур Void Ab Initio (5 U.S.C. § 3348)§!\nСюда сбрасываются аннулированные советники и министры при переполнении 210-дневных часов FVRA."
 BERN_GUI_BTN_VOID_PURGE:0 "Сбросить в Лоток"
 BERN_GUI_BTN_VOID_PURGE_TT:0 "§MСбросить в Лоток Фигур (5 U.S.C. § 3348)§!\nСтоимость: §Y1 ордер аннуляции§!\nСбрасывает таймер 210 дней FVRA (+90 дней), обращает +10% чиновников в Мебель, -8% скуки и сдвиг BoP вправо."

