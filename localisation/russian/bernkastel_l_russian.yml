 BERN_SE_INAUGURATION_TITLE:0 "§MОСКОЛОК 1 ИЗ 2 578 917: ПРЕЗИДЕНТСТВО БЕРНКАСТЕЛЬ§!"
 BERN_SE_INAUGURATION_QUOTE:0 "«Пока они живы, можно наслаждаться их борьбой. Когда они мертвы — можно наслаждаться вырыванием их внутренностей. Истории — это то, чем можно насладиться дважды».\n§Y— Фредерика Бернкастель§!"
